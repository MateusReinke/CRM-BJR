services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Join Coolify's own shared network instead of the isolated per-project
    # network Compose creates by default - without this, the container can't
    # resolve other Coolify-managed resources' internal hostnames (like the
    # Postgres service), which surfaces as "getaddrinfo ENOTFOUND".
    networks:
      - coolify
    # Internal port only - Coolify's proxy routes the configured domain to
    # this. Do not add a host "ports" mapping here (e.g. "5000:5000"): that
    # binds the port directly on the server and blocks zero-downtime
    # redeploys (the next container can't bind the same port until the old
    # one fully stops).
    expose:
      - "5000"
    environment:
      # Fixed on purpose (no ${VAR} interpolation) so Coolify has nothing to
      # show as editable for these, and they can't drift out of sync with
      # the hardcoded "expose: 5000" above or with how the Dockerfile
      # decides dev vs production mode.
      - PORT=5000
      - NODE_ENV=production
      - SESSION_SECRET=0993b28e4aebb61ede9df8778dc33828988e11ef25086b1454ca97b8162f5410
      - ENCRYPTION_KEY=d92f16acb456c239667bd1476e4091ebb50462cc9fe5692516f03f7e82a41a44
      # The one field that's actually meant to be edited per deployment.
      # Replace USUARIO/SENHA/HOST/NOME_DO_BANCO with your Postgres
      # resource's own internal connection details (copy them from that
      # resource's page in Coolify - do not type the password by hand).
      - DATABASE_URL=${DATABASE_URL:-postgresql://USUARIO:SENHA@HOST:5432/NOME_DO_BANCO}

networks:
  coolify:
    external: true
